<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miqnas ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F6; --card:#ffffff; --ink:#0F2B27; --muted:#56706B; --line:#D3E2DF;
  --brand:#123F3A; --brand2:#107366; --accent:#E8753D;
  --ok:#1f8a4c; --okbg:#e6f4ec; --bad:#c0392b; --badbg:#fbeaea; --warn:#b7791f; --warnbg:#fdf3e1;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit}
.hidden{display:none!important}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--brand) 0%,#0a2a2b 100%)}
.login{background:var(--card);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo{font-weight:700;font-size:24px;color:var(--brand);letter-spacing:.5px}
.logo span{color:var(--accent)}
.login p{color:var(--muted);margin:6px 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand2);border-color:transparent}
.btn{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:600;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.ghost:hover{background:#eef3f2}
.btn.small{padding:7px 12px;font-size:13px}
.btn.full{width:100%;margin-top:20px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}

/* app */
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
.hbar{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
header .logo{color:#fff;font-size:20px;font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif}
header{border-bottom:3px solid var(--accent)}
.spacer{flex:1}
.who{font-size:14px;text-align:left;line-height:1.3}
.who small{opacity:.75;display:block}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.22)}
#nav{max-width:1200px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto}
#nav button{background:none;border:0;color:rgba(255,255,255,.72);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
#nav button.on{color:#fff;border-bottom-color:var(--accent)}
#nav button.soon{opacity:.45;cursor:default}
#nav button.soon:after{content:" · قريباً";font-size:11px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
h2{font-size:19px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:150px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:26px;color:var(--brand)}
.kpi span{color:var(--muted);font-size:13px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{background:#f0f4f3;color:var(--muted);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.p-in{background:var(--okbg);color:var(--ok)}
.p-out{background:#eef1f0;color:var(--muted)}
.p-absent{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}

/* clock */
.clock{max-width:560px;margin:0 auto;text-align:center;padding:30px 22px}
.big-time{font-size:46px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;margin:8px 0}
.state{font-size:15px;margin-bottom:6px}
.clock .btn{font-size:18px;padding:15px 34px;margin-top:16px;border-radius:14px}
.btn.out{background:var(--bad)}
.btn.out:hover{background:#a5301f}
.share-ok{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--okbg);color:var(--ok);font-size:14px}
.notice{margin-top:16px;padding:12px 14px;border-radius:10px;background:#f0f4f3;color:var(--muted);font-size:13px;text-align:right;line-height:1.8}
.alarm{position:fixed;inset:0;background:rgba(15,25,25,.78);z-index:50;display:grid;place-items:center;padding:16px}
.alarm .card{max-width:440px;text-align:center;border-top:5px solid var(--bad)}
.alarm h2{color:var(--bad)}

/* shots */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.shot img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#dde4e2}
.shot div{padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted)}
.events{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ev{font-size:12px;padding:4px 10px;border-radius:99px;background:#f0f4f3}
.ev.stop{background:var(--badbg);color:var(--bad)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,20,.6);z-index:40;display:grid;place-items:center;padding:16px}
.modal .card{width:100%;max-width:460px;max-height:90vh;overflow:auto}
.modal.img .card{max-width:1100px;padding:10px}
.modal.img img{width:100%;display:block;border-radius:8px}
.mfoot{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px}
.check input{width:auto}
.pw{font-size:22px;font-weight:700;letter-spacing:2px;background:#f0f4f3;border-radius:10px;padding:12px;text-align:center;margin:10px 0;direction:ltr}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px}
.loading{padding:30px;text-align:center;color:var(--muted)}
#cap{position:fixed;left:-10000px;top:0;width:2px;height:2px;opacity:0}
@media (max-width:600px){ .who{display:none} .big-time{font-size:38px} }

/* ===== المشاريع والتاسكات ===== */
.en{direction:ltr;text-align:left}
.en th,.en td{text-align:left}
.en input,.en select{direction:ltr}
.en #pf_client{direction:rtl;text-align:left}
.p-prog{background:#e3eefc;color:#1d4f91}
.p-run{background:#fde9dc;color:#b4511c}
.p-na{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.p-lock{background:#eef1f0;color:var(--muted)}
.pbar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px}
.pbar>i{display:block;height:100%;background:var(--brand2);border-radius:99px}
tr.clk{cursor:pointer} tr.clk:hover td{background:#f0f6f4}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.flt button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer;color:var(--muted);font-size:14px}
.flt button span{font-size:12px;opacity:.8}
.flt button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.runlist{display:grid;gap:6px}
.runit{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.runit .ttime{margin-inline-start:auto}
.phead{display:grid;gap:14px;margin-top:10px;border-top:4px solid var(--accent)}
.pmeta,.pteam{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.pmeta b,.pteam b{color:var(--muted);font-weight:500;margin-inline-end:6px}
.pteam{border-top:1px dashed var(--line);padding-top:12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links.sm{margin-bottom:8px}
.lnk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:7px 12px;text-decoration:none;color:var(--ink);background:#f7faf9;font-size:13px}
.lnk:hover{border-color:var(--brand2)}
.lnk b{color:var(--brand2)} .lnk span{color:var(--muted);font-size:12px}
.tgroup{margin-top:14px;padding:6px 18px 10px}
.tghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.trow{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trow:last-child{border-bottom:0}
.trow.na{opacity:.5}
.trow.locked .tt{color:var(--muted)}
.trow.running{background:linear-gradient(90deg,transparent,#fdf1e8);margin:0 -18px;padding-inline:18px}
.trow.done .tt{text-decoration:line-through;text-decoration-color:var(--line);color:var(--muted)}
.tmain{flex:1;min-width:220px;display:grid;gap:5px}
.tt{font-weight:600;font-size:14.5px}
.twait{font-size:12.5px;color:var(--muted)}
.tlink{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tlink>span:first-child{color:var(--muted)}
.tlink input{flex:1;min-width:180px;max-width:420px;padding:6px 10px;font-size:13px}
.tlink a{color:var(--brand2);overflow-wrap:anywhere}
.tside{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttime{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.tb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.tb.play{background:var(--brand2);border-color:var(--brand2);color:#fff}
.tb.pause{background:var(--accent);border-color:var(--accent);color:#fff}
.tb.ok{color:var(--ok);border-color:#bfe1cc}
.tb.ghost{color:var(--muted)}
.tb:hover{filter:brightness(.96)}
.tforce{width:auto;padding:5px 8px;font-size:12.5px}
.pform h3{margin:22px 0 4px;color:var(--brand2)}
.pfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px}
.pfsec{background:#f7faf9;border:1px dashed var(--line);border-radius:12px;padding:4px 14px 12px}
@media (max-width:600px){ .tgroup{padding:6px 12px 10px} .trow.running{margin:0 -12px;padding-inline:12px} }

/* ===== البريفات ===== */
.bapp{
  --bg:#F3F7F6; --surface:#FFFFFF; --ink:#0F2B27; --muted:#56706B; --line:#D3E2DF;
  --accent:#107366; --accent-ink:#FFFFFF; --accent-soft:#E5F1EF;
  --warn:#B4511C; --warn-soft:#FCEBDF; --done:#107366; --done-soft:#E1F0ED; --danger:#B3261E;
  --brand-deep:#123F3A; --brand-orange:#E8753D; --sand:#D8C7A3;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px; --logo-bg:#FFFFFF; --field:#F7F2E8; --warn-line:#F0B48F;
}
.bapp{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
.bapp .wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.bapp h1,.bapp h2,.bapp h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.bapp button{font:inherit;cursor:pointer}
.bapp :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bapp .muted{color:var(--muted)}
.bapp .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.bapp .btn:hover{border-color:var(--accent)}
.bapp .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bapp .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.bapp .btn.ghost:hover{color:var(--ink)}
.bapp .btn.danger{color:var(--danger)}
.bapp .btn:disabled{opacity:.5;cursor:default}
.bapp .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.bapp .brand{display:flex;flex-direction:column;gap:2px}
.bapp .brand small{color:var(--muted);font-size:13px}
.bapp .pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.bapp .pill.draft{background:var(--warn-soft);color:var(--warn)}
.bapp .pill.done{background:var(--done-soft);color:var(--done)}
.bapp .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bapp .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bapp .bar>i{transition:none}}
.bapp .note{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.bapp .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bapp .tools input{flex:1;min-width:0}
.bapp .ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bapp .row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 110px 120px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:start;background:none;border-inline:0;border-bottom:0;color:inherit}
.bapp .row:first-child{border-top:0}
.bapp .row.head{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
.bapp button.row:hover{background:var(--accent-soft)}
.bapp .row .t{font-weight:600}
.bapp .row .s{font-size:13px;color:var(--muted)}
.bapp .row .p{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:640px){.bapp .row{grid-template-columns:minmax(0,1fr) auto}
.bapp .row .c3,.bapp .row .c2{display:none}
.bapp .row.head{display:none}}
.bapp .sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.bapp .progline{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bapp .progline .bar{flex:1}
.bapp .progline b{font-variant-numeric:tabular-nums;font-size:13px;min-width:3.5em}
.bapp .rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.bapp .rail button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px}
.bapp .rail button.full{color:var(--done);border-color:var(--done)}
.bapp .rail button:hover{color:var(--ink);border-color:var(--accent)}
.bapp .sec{margin-top:28px;scroll-margin-top:120px}
.bapp .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bapp .sec-h h2{font-size:19px}
.bapp .sec-h .grp{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.bapp .sec-h .cnt{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bapp .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.bapp .q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px 20px;padding:14px 16px;border-top:1px solid var(--line)}
.bapp .q:first-child{border-top:0}
.bapp .q.cond{background:var(--accent-soft)}
.bapp .q label.l{font-weight:600;font-size:14px}
.bapp .q .h{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-line}
.bapp .q .a{min-width:0}
.bapp .q.empty .a input,.bapp .q.empty .a textarea,.bapp .q.empty .a select{border-color:var(--warn-line)}
@media (max-width:640px){.bapp .q{grid-template-columns:minmax(0,1fr)}}
.bapp select,.bapp input[type=text],.bapp input[type=url],.bapp input[type=number],.bapp input[type=date],.bapp input[type=search],.bapp textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.bapp textarea{resize:vertical;min-height:64px}
.bapp select:focus,.bapp input:focus,.bapp textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.bapp input[dir=ltr]{text-align:left}
.bapp .seg{display:flex;flex-wrap:wrap;gap:6px}
.bapp .seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px;font-size:14px}
.bapp .seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bapp .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:14px 16px}
.bapp .chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);font-size:14px;cursor:pointer}
.bapp .chk input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.bapp .chk.on{border-color:var(--accent);background:var(--accent-soft)}
.bapp .formfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:28px}
.bapp .saved{font-size:13px;color:var(--muted)}
.bapp .logo-tile{flex:none;background:var(--logo-bg);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.bapp .logo-tile img{width:100%;height:100%;object-fit:contain;padding:8%}
.bapp .vtitle{display:flex;gap:16px;align-items:center}
.bapp .vtitle .logo-tile{width:84px;height:84px}
.bapp .vtitle .tt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.bapp .thumb{width:34px;height:34px;border-radius:8px}
.bapp .storecell{display:flex;gap:10px;align-items:center;min-width:0}
.bapp .logo-pick{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}
.bapp .logo-pick .logo-tile{width:72px;height:72px}
.bapp .logo-drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--muted);cursor:pointer;background:var(--surface)}
.bapp .logo-drop:hover,.bapp .logo-drop.over{border-color:var(--accent);color:var(--ink)}
.bapp .logo-drop .plus{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;flex:none}
@media (max-width:640px){.bapp .vtitle .logo-tile{width:64px;height:64px}}
.pdfwrap{position:fixed;top:0;left:0;width:0;height:0;overflow:hidden;pointer-events:none}
.bapp .pdf-dark{--bg:#0B2420;--surface:#123F3A;--ink:#EAF3F1;--muted:#A3BDB8;--line:#22564F;--accent:#4FB8A8;--accent-ink:#06201C;--accent-soft:#17514A;--warn:#F2A47C;--warn-soft:#3B2A1F;--warn-line:#7A4A2E;--field:#0E302B;--done:#6CCBBB;--done-soft:#164C45;--danger:#F08A80;--brand-deep:#0B2420;--brand-orange:#EE8857;--sand:#D8C7A3;color-scheme:dark}
.bapp .pdf-light{--field:#F3F6F4;--bg:#FFFFFF;--surface:#FFFFFF;--ink:#16231F;--muted:#5E6B66;--line:#DCE3DF;--accent:#0F6B57;--accent-ink:#FFFFFF;--accent-soft:#E2EFEA;--warn:#9A6516;--warn-soft:#FBF0DC;--done:#2C7A4B;--done-soft:#E3F2E8;color-scheme:light}
.bapp .pdfdoc{width:794px;padding:4px 40px 24px;background:var(--bg);color:var(--ink);direction:rtl;font-family:var(--f-body);font-size:14px;line-height:1.6}
.bapp .pdfdoc .pdf-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding-bottom:12px}
.bapp .pdfdoc .sec-h .cnt,.bapp .pdfdoc .vhead .pill,.bapp .pdfdoc .vhead .m-prog,.bapp .pdfdoc .vhead .bar{display:none}
.bapp .pdfdoc .vq{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.bapp .pdfdoc .vtitle .logo-tile{width:84px;height:84px}
.bapp .credf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bapp .cred{display:grid;gap:4px}
.bapp .credr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.bapp .credk{font-size:12px;color:var(--muted);min-width:3.6em}
.bapp .credv{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere;min-width:0}
.bapp .mini{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:1px 8px;font-size:12px}
.bapp .mini:hover{color:var(--ink);border-color:var(--accent)}
.bapp .none{color:var(--muted);opacity:.6}
.bapp .accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px}
.bapp .acc{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:grid;gap:10px;background:var(--surface);min-width:0}
.bapp .acc-h{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bapp .acc-h b{font-family:var(--f-display);font-weight:600;font-size:15px}
.bapp .acc-ic{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:16px;flex:none}
.bapp .acc-ic.sm{font-size:11px;letter-spacing:.02em}
.bapp .acc-f{display:grid;gap:4px;min-width:0}
.bapp .acc-k{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:500}
.bapp .acc-v{display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;min-width:0}
.bapp .acc-v .credv{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere;font-size:13.5px;letter-spacing:.01em}
.bapp .ib{flex:none;width:28px;height:28px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:6px}
.bapp .ib:hover{background:var(--surface);color:var(--accent)}
.bapp .ib.on{color:var(--accent)}
.bapp .pdfdoc .accgrid{grid-template-columns:1fr 1fr}
.bapp .vsec{margin-top:30px}
.bapp .vsec .sec-h{background:var(--accent-soft);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:13px 18px;margin:0;align-items:center}
.bapp .vsec .sec-h h2{font-size:17px;color:var(--ink);display:flex;align-items:center;gap:10px}
.bapp .vsec .sec-h h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.bapp .vsec .sec-h .grp,.bapp .vsec .sec-h .cnt{display:none}
.bapp .vsec>.card{border-radius:0 0 12px 12px}
.bapp .grp-band{margin-top:40px;display:flex;align-items:center;gap:14px;color:var(--accent);font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.01em}
.bapp .grp-band::after{content:"";flex:1;height:1px;background:var(--line)}
.bapp .vsec.sub{margin-top:14px}
.bapp .vsec.sub .sec-h{background:var(--surface);padding:11px 18px}
.bapp .vsec.sub .sec-h h2{font-size:15px;color:var(--accent)}
.bapp .vsec.sub .sec-h h2::before{width:6px;height:6px;background:transparent;border:1.5px solid var(--accent)}
.bapp .vsec.sub>.card{border-top:1px dashed var(--line)}
.bapp .login{max-width:380px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:8px}
.bapp .login h1{font-size:22px;margin-bottom:2px}
.bapp .login p{margin:0 0 10px}
.bapp .login label{font-size:13px;font-weight:600;margin-top:6px}
.bapp .login .btn.primary{justify-content:center;margin-top:12px;padding:10px}
.bapp .login .err{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px}
.bapp .login .ok{background:var(--done-soft);color:var(--done);border-radius:8px;padding:8px 12px;font-size:14px}
.bapp input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.bapp .userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.bapp .userbar .ub-act{display:flex;gap:4px}
.bapp .linkbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bapp .linkbox input{flex:1;min-width:0}
.bapp .vhead{border-top:4px solid var(--brand-orange)}
.bapp .vsec .sec-h h2::before{background:var(--brand-orange)!important}
.bapp .vsec.sub .sec-h h2::before{background:transparent!important;border-color:var(--brand-orange)!important}
.bapp .grp-band::after{background:linear-gradient(90deg,var(--line),var(--brand-orange))!important;height:2px!important}
.bapp .login{border-top:4px solid var(--brand-orange)}
.bapp .userbar b{color:var(--accent)}
.bapp .acc-h{border-bottom-color:var(--sand)!important}
.bapp .vhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.bapp .vhead h1{font-size:26px}
.bapp .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.bapp .meta span b{font-weight:500;color:var(--muted);margin-inline-end:6px}
.bapp .actions{display:flex;gap:8px;flex-wrap:wrap}
.bapp dl{margin:0}
.bapp .vq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:4px 20px;padding:11px 16px;border-top:1px solid var(--line)}
.bapp .vq:first-child{border-top:0}
.bapp .vq dt{color:var(--muted);font-size:14px}
.bapp .vq dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bapp .vq dd.none{color:var(--muted);opacity:.6}
@media (max-width:640px){.bapp .vq{grid-template-columns:minmax(0,1fr)}}
.bapp .tags{display:flex;flex-wrap:wrap;gap:6px}
.bapp .tag{font-size:13px;border-radius:6px;padding:2px 10px;background:var(--done-soft);color:var(--done)}
.bapp .tag.off{background:transparent;color:var(--muted);border:1px dashed var(--line);text-decoration:line-through;text-decoration-color:var(--line)}
.bapp .confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px}
.bapp .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20}
.bapp label{display:revert;margin:0;color:inherit;font-size:inherit}
.bapp .card{padding:0}
.bapp input[type=checkbox]{padding:0;width:17px}
.bapp input[type=file]{display:none}
.bapp .btn:hover{background:var(--surface)}
.bapp .btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.bapp .btn.ghost:hover{background:transparent}
.bapp .btn.small{padding:8px 14px;font-size:inherit}
.bapp .wrap{padding-block:4px 60px}
.bapp .row>div{flex:initial;min-width:0}
.bapp [hidden]{display:none!important}
.bapp .sticky{top:var(--hdr,0px)}
.bapp .sec{scroll-margin-top:calc(var(--hdr,0px) + 120px)}
.bapp .assign{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.bapp .assign .seg button{display:inline-flex;align-items:baseline;gap:2px}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap hidden">
  <form class="login" id="loginForm">
    <div class="logo">Miqnas <span>ERP</span></div>
    <p>سجّل دخولك باليوزر والباسورد</p>
    <label>اليوزر</label>
    <input id="lu" autocomplete="username" dir="ltr" required>
    <label>الباسورد</label>
    <input id="lp" type="password" autocomplete="current-password" dir="ltr" required>
    <button class="btn full" id="lbtn">دخول</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header>
    <div class="hbar">
      <div class="logo">Miqnas <span style="color:var(--accent)">ERP</span></div>
      <div class="spacer"></div>
      <div class="who"><span id="uName"></span><small id="uRole"></small></div>
      <button class="hbtn" onclick="openPw()">الباسورد</button>
      <button class="hbtn" onclick="logout()">خروج</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
</div>

<div id="boot" class="loading">جاري التحميل...</div>
<video id="cap" muted playsinline></video>
<div id="modalRoot"></div>

<script>
/* ===== موديول البريفات ===== */

(function(){

const SITE_URL = window.ERP_SITE_URL || (location.origin + location.pathname);
const briefLink = id => SITE_URL + "#brief=" + id;

const PAY = ["تابي","تمارا","مدى","Visa","Apple Pay","Zid Pay","Salla Pay","الدفع عند الاستلام"];
const DOCS = ["وثيقة العمل الحر","الهوية الوطنية (National ID)","شهادة الضريبة (VAT Certificate)","العنوان الوطني (National Address)","الآيبان / شهادة بنكية (IBAN)","رقم توثيق المتجر (Store Verification Phone)","السجل التجاري (CR Number)","الرقم الضريبي (VAT Number)"];

const SECTIONS = [
 {id:"client", title:"بيانات العميل", items:[
  {id:"store_name", label:"اسم المتجر", type:"text"},
  {id:"client_name", label:"اسم العميل", type:"text"},
  {id:"am_name", label:"اسم الأكاونت مانجر", type:"text", headerOnly:true},
  {id:"zid_id", label:"الرقم التعريفي للمتجر على زد", type:"text", ltr:true},
  {id:"contact_times", label:"الأوقات المناسبة للتواصل", type:"text"},
  {id:"brief_date", label:"تاريخ البريف", type:"date"},
  {id:"drive", label:"لينك الدرايف الخاص بالعميل", type:"url"}]},
 {id:"scope", title:"Project Scope", items:[
  {id:"project_type", label:"نوع المشروع", type:"select", options:["نقل متجر","تحسين متجر","إنشاء متجر","نقل متجر كما هو"]},
  {id:"current_platform", label:"المنصة الحالية", type:"text", hint:"مثال: سلة"},
  {id:"target_platform", label:"المنصة اللي هينقل عليها", type:"text", hint:"مثال: زد"},
  {id:"store_url", label:"لينك المتجر الحالي", type:"url"},
  {id:"domain_owner", label:"الدومين مملوك لمين حاليًا؟", type:"text"},
  {id:"domain_change", label:"هل هيغيّر الدومين؟", type:"yn"},
  {id:"domain_change_details", label:"تفاصيل تغيير الدومين", type:"textarea", hint:"مثال: هيشتري دومين جديد من زد مجانًا أو من GoDaddy، ولسه ماستقرش", showIf:a=>a.domain_change==="أيوه"},
  {id:"domain_platform", label:"الدومين على أنهي منصة؟", type:"text", hint:"اليوزر والباسورد بيتكتبوا في قسم الأكسيس."},
  {id:"plan", label:"الباقة (Package / Plan)", type:"textarea", hint:"الباقة الحالية على المنصة، والباقة الخاصة بينا"},
  {id:"plan_end", label:"تاريخ انتهاء باقة المنصة", type:"date", hint:"المنصة اللي بننقل منها، اشتراكها بينتهي إمتى؟"},
  {id:"complaints", label:"أهم شكاوي العملاء والمتجر", type:"textarea", hint:"مثال: العملاء بتشتكي من عدم وجود جدول مقاسات، أو استفسارات متكررة عن المنتجات"}]},
 {id:"access", title:"الأكسيس", items:[
  {id:"acc_salla", label:"سلة", type:"cred", optional:true},
  {id:"acc_zid", label:"زد", type:"cred", optional:true},
  {id:"acc_domain", label:"الدومين", type:"cred", withLink:true, optional:true},
  {id:"acc_email", label:"الإيميل", type:"cred", optional:true},
  {id:"acc_tabby", label:"تابي", type:"cred", optional:true},
  {id:"acc_tamara", label:"تمارا", type:"cred", optional:true},
  {id:"acc_other", label:"حساب تاني", type:"cred", named:true, optional:true}]},
 {id:"products", group:"Store Manager", title:"المنتجات", items:[
  {id:"products_scope", label:"نقل المنتجات", type:"choice", options:["كل المنتجات","منتجات معينة"]},
  {id:"products_which", label:"أنهي منتجات؟", type:"textarea", showIf:a=>a.products_scope==="منتجات معينة"},
  {id:"same_categories", label:"هتتنقل بنفس التصنيفات؟", type:"yn"},
  {id:"products_count", label:"عدد المنتجات", type:"text"},
  {id:"variants", label:"خيارات ومخزون المنتجات", type:"textarea"},
  {id:"product_notes", label:"تعليمات عن المنتجات إن وجدت", type:"textarea"},
  {id:"hidden_products", label:"هل في منتجات مخفية؟", type:"yn"},
  {id:"hidden_transfer", label:"المنتجات المخفية هتتنقل؟", type:"yn", showIf:a=>a.hidden_products==="أيوه"},
  {id:"oos_transfer", label:"المنتجات الـ Out of Stock هتتنقل؟", type:"yn"}]},
 {id:"shipping", group:"Store Manager", title:"الشحن", items:[
  {id:"shipping_cos", label:"شركات الشحن والتوصيل", type:"textarea", hint:"الشركات المشترك فيها على المنصة. لو مفيش وفي مناديب خاصة، نسأل عنهم وعن تفاصيلهم."},
  {id:"shipping_zones", label:"المناطق المخصصة للشحن", type:"textarea"},
  {id:"shipping_options", label:"خيارات الشحن", type:"multi", options:["شحن للعميل","استلام من الفرع"]},
  {id:"pickup_cod", label:"الدفع عند الاستلام مفعّل مع الاستلام من الفرع؟", type:"yn", showIf:a=>(a.shipping_options||[]).includes("استلام من الفرع")},
  {id:"branches", label:"بيانات الفروع", type:"textarea", hint:"اسم الفرع والعنوان ومواعيد الاستلام", showIf:a=>(a.shipping_options||[]).includes("استلام من الفرع")},
  {id:"support_phone", label:"رقم دعم خدمة العملاء", type:"text", ltr:true}]},
 {id:"payment", group:"Store Manager", title:"طرق الدفع", items:[
  {id:"payments", label:"طرق الدفع المفعّلة", type:"checks", options:PAY}]},
 {id:"docs", group:"Store Manager", title:"الوثائق الرسمية", items:[
  {id:"documents", label:"الوثائق المستلمة", type:"checks", options:DOCS},
  {id:"docs_drive", label:"لينك درايف مجمّع بكل الوثائق", type:"url"}]},
 {id:"side", group:"Store Manager", title:"معلومات إضافية", items:[
  {id:"categories", label:"الأقسام الخاصة بالمتجر", type:"textarea"},
  {id:"discount_codes", label:"أكواد الخصم", type:"textarea"},
  {id:"blogs", label:"المدونات", type:"textarea"},
  {id:"policies", label:"السياسات", type:"textarea"},
  {id:"reviews", label:"آراء العملاء", type:"textarea"},
  {id:"verify_phone", label:"رقم هاتف توثيق المتجر على زد / سلة", type:"text", ltr:true},
  {id:"cashback", label:"هل يوجد كاش باك؟", type:"yn"},
  {id:"cashback_details", label:"إيه هي الخصومات المطبقة؟", type:"textarea", hint:"نسبة الكاش باك وشروطه، وأي خصومات تانية شغالة", showIf:a=>a.cashback==="أيوه"},
  {id:"offers", label:"هل في عروض مطبقة حاليًا؟", type:"yn"},
  {id:"offers_details", label:"العروض وشروطها", type:"textarea", showIf:a=>a.offers==="أيوه"}]},
 {id:"uiux", title:"UI / UX", items:[
  {id:"brand_story", label:"قصة البراند (Brand Story)", type:"textarea", hint:"معنى اسم المتجر والقصة من إنشائه"},
  {id:"tone", label:"نبرة الكلام (Tone of Voice)", type:"textarea", hint:"بيخاطب أي فئة؟ والأسلوب ودّي، رسمي، ولا شبابي؟"},
  {id:"audience", label:"الجمهور المستهدف", type:"textarea", hint:"مثال: شباب، أطفال، ستات. العمر من 16 لـ 40 سنة"},
  {id:"identity", label:"الهوية البصرية (Brand Identity)", type:"textarea", hint:"لو عنده هوية: الألوان، اللوجو، الخطوط المستخدمة"},
  {id:"identity_link", label:"لينك الهوية البصرية", type:"url", optional:true, hint:"اختياري. لو العميل عنده ملف هوية على درايف أو Behance أو غيره"},
  {id:"design_style", label:"أسلوب التصميم", type:"textarea"},
  {id:"home_page", label:"الصفحة الرئيسية", type:"textarea"},
  {id:"banners", label:"البنرات", type:"textarea", hint:"محتاج كام بانر؟ ولأي أقسام بالظبط؟"},
  {id:"banner_sizes", label:"مقاسات البنرات", type:"text"},
  {id:"product_pages", label:"صفحات المنتجات", type:"textarea"},
  {id:"competitors", label:"منافسين أو References", type:"textarea"},
  {id:"best_sellers", label:"المنتجات الأكثر مبيعًا / اللي بنركز عليها في البنرات", type:"textarea"},
  {id:"product_photos", label:"صور المنتجات بجودة عالية", type:"textarea"},
  {id:"header_footer", label:"الفوتر والهيدر", type:"textarea", hint:"هل هيتضاف حاجة معينة في الفوتر أو الهيدر؟"}]},
 {id:"designer", title:"Designer", items:[
  {id:"logo_plan", label:"اللوجو", type:"choice", options:["هيفضل زي ما هو","تحسين على الحالي","لوجو جديد"]},
  {id:"logo_notes", label:"المطلوب في اللوجو", type:"textarea", showIf:a=>a.logo_plan&&a.logo_plan!=="هيفضل زي ما هو"},
  {id:"colors", label:"الألوان المستخدمة", type:"textarea", hint:"لو مش هيغيّر حاجة: نفس الهوية اللي في قسم UI / UX"},
  {id:"design_refs", label:"References", type:"textarea"}]}
];

const $ = s => document.querySelector(s);
let app = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const filled = v => Array.isArray(v) ? v.length > 0 : (v && typeof v==="object") ? Object.values(v).some(x=>String(x??"").trim()!=="") : (v !== undefined && v !== null && String(v).trim() !== "");
const cntText = c => c.t ? `${c.d} من ${c.t}` : "اختياري";
const visible = (it, a) => !it.showIf || it.showIf(a);
function progress(a){
  let t=0,d=0;
  for (const s of SECTIONS) for (const it of s.items){ if (it.type==="checks"||!visible(it,a)) continue; if (it.optional&&!filled(a[it.id])) continue; t++; if (filled(a[it.id])) d++; }
  return {t,d,pct:t?Math.round(d/t*100):0};
}
function secCount(s,a){let t=0,d=0;for(const it of s.items){if(!visible(it,a))continue;if(it.optional&&!filled(a[it.id]))continue;if(it.type==="checks"){t++;if(filled(a[it.id]))d++;continue;}t++;if(filled(a[it.id]))d++;}return {t,d};}
const fmtDate = v => { if(!v) return ""; const d=new Date(v); return isNaN(d)?"":d.toLocaleDateString("ar-EG",{day:"numeric",month:"short",year:"numeric"}); };
function toast(msg){ window.erpToast(msg); }
async function copy(text){try{await navigator.clipboard.writeText(text);toast("اتنسخ");}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("اتنسخ");}catch(_){toast("ماقدرتش أنسخ، انسخ يدوي");}ta.remove();}}

let me=null, myName="", canWrite=false, isAdmin=false, myRole="", seeAccess=false, teamUsers=null;
const session="";
let briefs=new Map(), loaded=false, route={v:"list"}, query="", amFilter="", confirmDel=false;
let draft=null, saveTimer=null, saving=false, again=false, lastSaved=null;
const API_MAP={listBriefs:()=>["briefList",{}],getBrief:(_,id)=>["briefGet",{id}],saveBrief:(_,brief)=>["briefSave",{brief}],deleteBrief:(_,id)=>["briefDelete",{id}],exportAll:()=>["briefExport",{}],importBriefs:(_,list)=>["briefImport",{list}]};
function api(fn,...args){ const [a,p]=API_MAP[fn](...args); return window.erpCall(a,p); }
const canEditB = b => !!b && (isAdmin || (myRole==="am" && b.owner===me));
const canSeeAccess = () => myRole!=="team" || seeAccess;
function setHash(id){ try{ history.replaceState(null,"", id ? "#brief="+id : location.pathname+location.search); }catch(e){} }

function go(r){
  if (route.v==="edit" && draft){ flush(false, draft); draft=null; }
  route=r; confirmDel=false;
  setHash(r.v==="view"?r.id:"");
  if(r.v==="list") loadList();
  render(); window.scrollTo(0,0);
}

const amOf = b => String((b.answers&&b.answers.am_name)||"").trim() || b.amName || "";

function render(){
  if (route.v==="edit") return renderForm();
  if (route.v==="view") return renderView();

}

  const nb=$("#new"); if(nb) nb.onclick=newBrief;

function newBrief(){
  const id="b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const today=new Date().toISOString().slice(0,10);
  draft={id,isNew:true,am:me,status:"draft",thumb:"",createdAt:Date.now(),answers:{brief_date:today, am_name: myRole==="am"?myName:""}};
  route={v:"edit",id}; render(); window.scrollTo(0,0);
}
function editBrief(id){
  const b=briefs.get(id); if(!b) return;
  draft={id,logo:b.logo||"",thumb:b.thumb||"",am:b.owner||me,status:b.status||"draft",createdAt:b.createdAt||Date.now(),answers:JSON.parse(JSON.stringify(b.answers||{}))};
  route={v:"edit",id}; render(); window.scrollTo(0,0);
}

function field(it,a){
  const v=a[it.id], id="f_"+it.id;
  switch(it.type){
    case "textarea": return `<textarea id="${id}" data-k="${it.id}" rows="2">${esc(v)}</textarea>`;
    case "url": return `<input type="url" dir="ltr" id="${id}" data-k="${it.id}" value="${esc(v)}" placeholder="https://">`;
    case "cred": { const o=v||{}; return `<div class="credf">${it.named?`<input type="text" data-cred="${it.id}" data-part="n" value="${esc(o.n)}" placeholder="اسم المنصة" aria-label="اسم المنصة">`:""}<input type="text" dir="ltr" id="${id}" data-cred="${it.id}" data-part="u" value="${esc(o.u)}" placeholder="الإيميل أو اليوزر" aria-label="${esc(it.label)}: الإيميل أو اليوزر" autocomplete="off"><input type="text" dir="ltr" data-cred="${it.id}" data-part="p" value="${esc(o.p)}" placeholder="الباسورد" aria-label="${esc(it.label)}: الباسورد" autocomplete="off" spellcheck="false">${it.withLink?`<input type="url" dir="ltr" data-cred="${it.id}" data-part="l" value="${esc(o.l)}" placeholder="لينك منصة الدومين (اختياري)" aria-label="لينك منصة الدومين" style="grid-column:1/-1">`:""}</div>`; }
    case "select": { const opts=[...it.options]; if(filled(v)&&!opts.includes(v)) opts.push(v);
      return `<select id="${id}" data-k="${it.id}"><option value=""${filled(v)?"":" selected"}>اختار...</option>${opts.map(o=>`<option value="${esc(o)}"${v===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`; }
    case "number": return `<input type="number" min="0" inputmode="numeric" id="${id}" data-k="${it.id}" value="${esc(v)}">`;
    case "date": return `<input type="date" id="${id}" data-k="${it.id}" value="${esc(v)}">`;
    case "yn": case "choice": {
      const opts=it.type==="yn"?["أيوه","لا"]:it.options;
      return `<div class="seg" role="group" aria-label="${esc(it.label)}">${opts.map(o=>`<button type="button" data-one="${it.id}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join("")}</div>`;}
    case "multi": return `<div class="seg" role="group" aria-label="${esc(it.label)}">${it.options.map(o=>`<button type="button" data-many="${it.id}" data-v="${esc(o)}" aria-pressed="${(v||[]).includes(o)}">${esc(o)}</button>`).join("")}</div>`;
    default: return `<input type="text" id="${id}" data-k="${it.id}" value="${esc(v)}"${it.ltr?' dir="ltr"':""}>`;
  }
}

  $("#finish").onclick=async()=>{ if(!filled(a.store_name)){toast("اكتب اسم المتجر الأول");$("#f_store_name").focus();return;} draft.status="done"; const dd=draft; draft=null; await flush(true, dd); const id=dd.id; go({v:"view",id}); };

function railHTML(a){return SECTIONS.map(s=>{const c=secCount(s,a);return `<button type="button" data-sec="${s.id}" class="${c.t&&c.d===c.t?"full":""}">${esc(s.title)} <span style="font-variant-numeric:tabular-nums">${c.t?c.d+"/"+c.t:"اختياري"}</span></button>`;}).join("");}
function sectionHTML(s,a){
  const c=secCount(s,a);
  const body=s.items.filter(it=>visible(it,a)).map(it=>{
    if(it.type==="checks"){
      const sel=a[it.id]||[];
      return `<div class="checks" role="group" aria-label="${esc(it.label)}">${it.options.map(o=>`<label class="chk${sel.includes(o)?" on":""}"><input type="checkbox" data-chk="${it.id}" value="${esc(o)}"${sel.includes(o)?" checked":""}>${esc(o)}</label>`).join("")}</div>`;
    }
    return `<div class="q${it.showIf?" cond":""}${filled(a[it.id])||it.optional?"":" empty"}" data-q="${it.id}"${it.optional?" data-opt":""}>
      <div><label class="l" for="f_${it.id}">${esc(it.label)}</label>${it.hint?`<div class="h">${esc(it.hint)}</div>`:""}</div>
      <div class="a">${field(it,a)}</div></div>`;
  }).join("");
  return `<section class="sec" id="s_${s.id}"><div class="sec-h">${s.group?`<span class="grp">${esc(s.group)}</span>`:""}<h2>${esc(s.title)}</h2><span class="cnt">${cntText(c)}</span></div><div class="card">${body}</div></section>`;
}
function bindForm(){
  app.querySelectorAll("[data-k]").forEach(el=>{
    el.oninput=()=>{ draft.answers[el.dataset.k]=el.value; const q=el.closest(".q"); if(q) q.classList.toggle("empty",!filled(el.value)&&!q.hasAttribute("data-opt")); if(el.tagName==="TEXTAREA") autosize(el); changed(false); };
    if(el.tagName==="TEXTAREA") autosize(el);
  });
  app.querySelectorAll("[data-one]").forEach(b=>b.onclick=()=>{const k=b.dataset.one; draft.answers[k]=draft.answers[k]===b.dataset.v?"":b.dataset.v; changed(true);});
  app.querySelectorAll("[data-many]").forEach(b=>b.onclick=()=>{const k=b.dataset.many, arr=[...(draft.answers[k]||[])], i=arr.indexOf(b.dataset.v); i<0?arr.push(b.dataset.v):arr.splice(i,1); draft.answers[k]=arr; changed(true);});
  app.querySelectorAll("[data-cred]").forEach(el=>el.oninput=()=>{const k=el.dataset.cred; draft.answers[k]={...(draft.answers[k]||{}),[el.dataset.part]:el.value}; changed(false);});
  app.querySelectorAll("[data-chk]").forEach(c=>c.onchange=()=>{const k=c.dataset.chk; const arr=[...(draft.answers[k]||[])].filter(x=>x!==c.value); if(c.checked) arr.push(c.value); draft.answers[k]=arr; c.parentElement.classList.toggle("on",c.checked); changed(false);});
  $("#rail").onclick=e=>{const b=e.target.closest("[data-sec]"); if(b) document.getElementById("s_"+b.dataset.sec).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});};

function autosize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight+2,320)+"px";}
function changed(rerender){
  if(rerender){const y=window.scrollY; renderForm(); window.scrollTo(0,y);}
  else{const a=draft.answers,p=progress(a); $("#pct").textContent=p.pct+"%"; $("#pbar").style.width=p.pct+"%"; $("#pcount").textContent=`${p.d} من ${p.t}`; $("#rail").innerHTML=railHTML(a);
    app.querySelectorAll(".sec").forEach(sec=>{const s=SECTIONS.find(x=>"s_"+x.id===sec.id);const c=secCount(s,a);sec.querySelector(".cnt").textContent=cntText(c);});}
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>flush(),1200);
  const sv=$("#saved"); if(sv) sv.textContent="بيتحفظ...";
}
const okLogo = v => typeof v==="string" && /^data:image\/(png|jpeg|webp);base64,/.test(v);
function setLogo(file){
  if(!/^image\//.test(file.type)){toast("الملف ده مش صورة");return;}
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image(); img.onload=()=>{
      const max=360, k=Math.min(1,max/Math.max(img.naturalWidth||max,img.naturalHeight||max));
      const w=Math.max(1,Math.round((img.naturalWidth||max)*k)), h=Math.max(1,Math.round((img.naturalHeight||max)*k));
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      let url=c.toDataURL("image/png"); if(url.length>150000) url=c.toDataURL("image/webp",0.85); if(url.length>150000) url=c.toDataURL("image/jpeg",0.82);
      if(!okLogo(url)||url.length>200000){toast("الصورة كبيرة أوي، جرّب صورة أصغر");return;}
      const tk=Math.min(1,96/Math.max(w,h)), tc=document.createElement("canvas"); tc.width=Math.max(1,Math.round(w*tk)); tc.height=Math.max(1,Math.round(h*tk)); tc.getContext("2d").drawImage(c,0,0,tc.width,tc.height);
      draft.logo=url; draft.thumb=tc.toDataURL("image/png"); if(draft.thumb.length>40000) draft.thumb=tc.toDataURL("image/jpeg",0.8); changed(true); };
    img.onerror=()=>toast("ماقدرتش أفتح الصورة دي");
    img.src=rd.result; };
  rd.readAsDataURL(file);
}
function bodyOf(d){const a=d.answers,p=progress(a);return {id:d.id,status:d.status,logo:okLogo(d.logo)?d.logo:"",thumb:okLogo(d.thumb)?d.thumb:"",progress:p.pct,createdAt:d.createdAt,answers:a};}
async function flush(force, d=draft){
  clearTimeout(saveTimer);
  if(!d||!me) return;
  if(!filled(d.answers.store_name)){const sv=$("#saved"); if(sv) sv.textContent="هيتحفظ أول ما تكتب اسم المتجر"; return;}
  if(saving){again=d;return;}
  saving=true;
  try{
    const body=bodyOf(d); const r=await api("saveBrief",session,body);
    d.isNew=false; d.am=r.owner;
    const prev=briefs.get(d.id)||{};
    briefs.set(d.id,{...body,id:d.id,owner:r.owner,assigned:prev.assigned||[],canEdit:true,store:String(body.answers.store_name||"").trim(),client:String(body.answers.client_name||"").trim(),amName:(briefs.get(d.id)||{}).amName||myName,updatedAt:r.updatedAt,partial:false});
    lastSaved=new Date(); const sv=$("#saved"); if(sv&&draft===d) sv.textContent="اتحفظ "+lastSaved.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"});
  }
  catch(e){ const sv=$("#saved"); if(sv) sv.textContent="ماتحفظش. "+(e.message||"اتأكد من النت وجرّب تكتب تاني"); }
  finally{ saving=false; if(again){const n=again; again=false; flush(false, n);} }
}
const credStr = o => { o=o||{}; const parts=[]; if(o.n) parts.push(o.n); if(o.l) parts.push("لينك: "+o.l); parts.push("يوزر: "+(o.u||"—")); parts.push("باسورد: "+(o.p||"—")); return parts.join(" | "); };
function linkify(text){
  const t=String(text??""), re=/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi; let out="", last=0, m;
  while((m=re.exec(t))){
    let url=m[0]; const trail=(url.match(/[.,،;:!?)\]}"'»]+$/)||[""])[0]; if(trail) url=url.slice(0,-trail.length);
    out+=esc(t.slice(last,m.index));
    const href=/^www\./i.test(url)?"https://"+url:url;
    out+=`<a href="${esc(href)}" target="_blank" rel="noopener" dir="ltr" style="color:var(--accent)">${esc(url)}</a>`+esc(trail);
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}

function accLink(l,pdf){

  return `<div class="acc-f"><span class="acc-k">${ICO.link}لينك تسجيل الدخول</span><div class="acc-v" dir="ltr"><a class="credv" href="${esc(href)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(l)}</a>${pdf?"":`<button type="button" class="ib" data-copyv="${esc(l)}" aria-label="نسخ" title="نسخ">${ICO.copy}</button>`}</div></div>`;

function accField(kind,v,pdf){
  const secret=kind==="p";
  const val=pdf||!secret?`<span class="credv sel" dir="ltr">${esc(v)}</span>`:`<span class="credv" dir="ltr" data-secret="${esc(v)}">••••••••••</span>`;
  const btns=pdf?"":`${secret?`<button type="button" class="ib" data-reveal aria-label="إظهار الباسورد" title="إظهار">${ICO.eye}</button>`:""}<button type="button" class="ib" data-copyv="${esc(v)}" aria-label="نسخ" title="نسخ">${ICO.copy}</button>`;
  return `<div class="acc-f"><span class="acc-k">${secret?ICO.lock:ICO.user}${secret?"الباسورد":"اليوزر"}</span><div class="acc-v" dir="ltr">${val}${btns}</div></div>`;
}
function accessHTML(s,a,pdf){
  const cards=s.items.filter(it=>filled(a[it.id])).map(it=>{const o=a[it.id]||{}; const name=it.named&&o.n?o.n:it.label;
    return `<div class="acc"><div class="acc-h"><b>${esc(name)}</b></div>
      ${it.withLink&&o.l?accLink(o.l,pdf):""}${o.u?accField("u",o.u,pdf):""}${o.p?accField("p",o.p,pdf):""}</div>`;}).join("");

}
function credHTML(o,pdf){ o=o||{};
  const row=(k,v,secret)=>`<div class="credr"><span class="credk">${k}</span>${!v?`<span class="none">—</span>`:(secret&&!pdf?`<span class="credv" dir="ltr" data-secret="${esc(v)}">••••••••</span><button type="button" class="mini" data-reveal>إظهار</button><button type="button" class="mini" data-copyv="${esc(v)}">نسخ</button>`:`<span class="credv sel" dir="ltr">${esc(v)}</span>${pdf?"":`<button type="button" class="mini" data-copyv="${esc(v)}">نسخ</button>`}`)}</div>`;
  return `<div class="cred">${o.n?`<div class="credr"><span class="credk">المنصة</span><span>${esc(o.n)}</span></div>`:""}${row("يوزر",o.u,false)}${row("باسورد",o.p,true)}</div>`; }
function briefText(b){
  const a=b.answers||{}; const lines=[`بريف: ${b.store||""}`,`العميل: ${b.client||""}`,`الأكاونت مانجر: ${amOf(b)||"—"}`, ""];
  for(const s of SECTIONS){ if(s.id==="access"&&!canSeeAccess()) continue; lines.push(`■ ${s.group?s.group+" / ":""}${s.title}`);
    for(const it of s.items){ if(!visible(it,a)||it.headerOnly) continue; const v=a[it.id];
      if(it.type==="checks") lines.push(`${it.label}: ${(v||[]).join("، ")||"—"}`);
      else if(it.type==="cred") lines.push(`${it.label}: ${filled(v)?credStr(v):"—"}`);
      else lines.push(`${it.label}: ${Array.isArray(v)?(v.join("، ")||"—"):(filled(v)?v:"—")}`);}
    lines.push(""); }
  return lines.join("\n");
}
function headHTML(b){const a=b.answers||{}; return `
    <div class="vtitle">${okLogo(b.logo)?`<span class="logo-tile"><img src="${esc(b.logo)}" alt="لوجو ${esc(b.store||"")}"></span>`:""}<div class="tt"><h1>${esc(b.store||"بدون اسم")}</h1><span class="pill ${b.status==="done"?"done":"draft"}">${b.status==="done"?"مكتمل":"مسودة"}</span></div></div>
    <div class="meta">
      <span><b>العميل</b>${esc(b.client||"—")}</span>
      <span><b>الأكاونت مانجر</b>${esc(amOf(b)||"—")}</span>
      <span><b>تاريخ البريف</b>${esc(a.brief_date?fmtDate(a.brief_date):"—")}</span>

    <div class="bar"><i style="width:${b.progress||0}%"></i></div>
`;}
function sectionsHTML(a,pdf){let prevGroup=null;return `${SECTIONS.map(s=>{const band=!!s.group&&s.group!==prevGroup; prevGroup=s.group||null;
  if(s.id==="access") return canSeeAccess()?accessHTML(s,a,pdf):"";
  return `${band?`<div class="grp-band"><span>${esc(s.group)}</span></div>`:""}<section class="sec vsec${s.group?" sub":""}${band?" after-group":""}"><div class="sec-h">${s.group?`<span class="grp">${esc(s.group)}</span>`:""}<h2>${esc(s.title)}</h2></div><div class="card"><dl>
    ${s.items.filter(it=>visible(it,a)&&!it.headerOnly).map(it=>{const v=a[it.id];
      if(it.type==="cred") return `<div class="vq"><dt>${esc(it.label)}</dt><dd>${filled(v)?credHTML(v,pdf):`<span class="none">—</span>`}</dd></div>`;
      if(it.type==="checks") return `<div class="vq"><dt>${esc(it.label)}</dt><dd><div class="tags">${it.options.map(o=>`<span class="tag${(v||[]).includes(o)?"":" off"}">${esc(o)}</span>`).join("")}</div></dd></div>`;
      const shown=Array.isArray(v)?v.join("، "):(it.type==="date"&&v?fmtDate(v):v);
      const isLink=it.type==="url"&&/^https?:\/\//i.test(v||"");
      return `<div class="vq"><dt>${esc(it.label)}</dt><dd class="${filled(v)?"":"none"}"${it.ltr||it.type==="url"?' dir="ltr" style="text-align:right"':""}>${filled(v)?(isLink?`<a href="${esc(v)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(v)}</a>`:linkify(shown)):"—"}</dd></div>`;}).join("")}
  </dl></div></section>`;}).join("")}`;}
function renderView(){
  const b=briefs.get(route.id);
  const src=b;
  if(b&&b.partial){ app.innerHTML=`<div class="note">بيحمّل البريف...</div>`; loadFull(b.id); return; }

${headHTML(b)}

  app.querySelectorAll("[data-copyv]").forEach(btn=>btn.onclick=()=>copy(btn.dataset.copyv));

const downloads={ save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data],{type:/\.pdf$/.test(filename)?"application/pdf":"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); } };
const PDF_BG="#0B2420";
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement("script");el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el);});}
async function pdfLibs(){
  if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
const safeName = t => (String(t||"brief").replace(/[\\/:*?"<>|#]+/g," ").replace(/\s+/g," ").trim().slice(0,80)||"brief");
async function exportPDF(b,btn){
  const label=btn.textContent; btn.disabled=true; btn.textContent="بيجهّز الـ PDF...";
  let wrap=null;
  try{
    await pdfLibs(); try{await document.fonts.ready;}catch(_){}
    wrap=document.createElement("div"); wrap.className="pdfwrap";
    const host=document.createElement("div"); host.className="pdfdoc pdf-dark";
    host.innerHTML=`<div class="vhead">${headHTML(b)}</div>${sectionsHTML(b.answers||{},true)}`;
    const inner=document.createElement("div"); inner.className="bapp"; inner.appendChild(host); wrap.appendChild(inner); document.body.appendChild(wrap);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const W=794, scale=2, hr=host.getBoundingClientRect(), total=Math.ceil(hr.height);
    const texts=[]; host.querySelectorAll(".sel").forEach(el=>{const t=el.textContent; if(!/^[\x20-\x7E]+$/.test(t)) return; const r=el.getBoundingClientRect(); texts.push({x:r.left-hr.left,y:r.top-hr.top,w:r.width,h:r.height,t});});
    const links=[]; host.querySelectorAll("a[href]").forEach(a=>{ for(const r of a.getClientRects()) links.push({x:r.left-hr.left,y:r.top-hr.top,w:r.width,h:r.height,url:a.href}); });
    const cands=[...host.querySelectorAll(".vq,.vhead,.pdf-top,.checks,.accgrid")].map(e=>e.getBoundingClientRect().bottom-hr.top)
      .concat([...host.querySelectorAll(".sec:not(.after-group),.grp-band")].map(e=>e.getBoundingClientRect().top-hr.top-2)).sort((x,y)=>x-y);
    const canvas=await html2canvas(host,{scale,backgroundColor:PDF_BG,logging:false,width:W,height:total,windowWidth:1100});
    wrap.remove(); wrap=null;
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"pt",format:"a4",compress:true});
    const PW=pdf.internal.pageSize.getWidth(), PH=pdf.internal.pageSize.getHeight(), k=PW/W, m=30, maxH=PH/k-2*m;
    let y0=0, pages=0;
    while(y0<total-1){
      let y1=Math.min(total,y0+maxH);
      if(y1<total){const c=cands.filter(v=>v>y0+80&&v<=y1); if(c.length) y1=c[c.length-1];}
      if(pages) pdf.addPage();
      const sh=Math.max(1,Math.round((y1-y0)*scale)), pc=document.createElement("canvas"); pc.width=canvas.width; pc.height=sh;
      const ctx=pc.getContext("2d"); ctx.fillStyle=PDF_BG; ctx.fillRect(0,0,pc.width,sh);
      ctx.drawImage(canvas,0,Math.round(y0*scale),canvas.width,sh,0,0,canvas.width,sh);
      pdf.setFillColor(PDF_BG); pdf.rect(0,0,PW,PH,"F");
      pdf.addImage(pc.toDataURL("image/jpeg",0.92),"JPEG",0,m*k,PW,(y1-y0)*k);
      for(const T of texts){ if(T.y>=y0-1&&T.y+T.h<=y1+1){ const fs=T.h*k*0.72; pdf.setFont("helvetica","normal"); pdf.setFontSize(fs); const tw=pdf.getTextWidth(T.t); pdf.text(T.t, T.x*k, (T.y-y0+m)*k + T.h*k*0.78, {renderingMode:"invisible", horizontalScale: tw>0 ? (T.w*k)/tw : 1}); } }
      for(const L of links){ if(L.y>=y0-1&&L.y+L.h<=y1+1) pdf.link(L.x*k,(L.y-y0+m)*k,L.w*k,L.h*k,{url:L.url}); }
      y0=y1; pages++;
    }
    pdf.setFontSize(8); pdf.setTextColor(120,135,129);
    for(let p=1;p<=pages;p++){ pdf.setPage(p); pdf.setFont("helvetica","normal"); pdf.text(p+" / "+pages, PW/2, PH-14, {align:"center", horizontalScale:1, renderingMode:"fill"}); }
    await downloads.save({filename:safeName(b.store)+".pdf", data:pdf.output("arraybuffer")});
  }catch(e){
    if(!(e&&e.code==="declined")){ const why=String((e&&(e.message||e.code))||e||"").slice(0,90); toast(e&&e.code==="unavailable"?"التحميل مش متاح هنا":"ماقدرتش أعمل الـ PDF. السبب: "+why); }
  }finally{ if(wrap) wrap.remove(); btn.disabled=false; btn.textContent=label; }
}
async function exportCSV(){
  let all; try{ toast("بيجهّز الملف..."); all=await api("exportAll",session); }catch(e){ toast("ماقدرتش أصدّر. "+e.message); return; }
  const items=[]; for(const s of SECTIONS) for(const it of s.items) if(!it.headerOnly) items.push({sec:s.title,it});
  const cell=v=>{const t=String(v??""); return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const head=["المتجر","العميل","الأكاونت مانجر","الحالة","الإكتمال %","تاريخ الإنشاء","آخر تعديل","لينك البريف",...items.map(x=>x.sec+" - "+x.it.label)];
  const rows=all.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0)).map(b=>{const a=b.answers||{};
    return [b.store,b.client,amOf(b),b.status==="done"?"مكتمل":"مسودة",b.progress||0,b.createdAt?new Date(b.createdAt).toISOString().slice(0,10):"",b.updatedAt?new Date(b.updatedAt).toISOString().slice(0,10):"",briefLink(b.id),
      ...items.map(x=>{const v=a[x.it.id]; return x.it.type==="cred"?(filled(v)?credStr(v):""):Array.isArray(v)?v.join("، "):(v??"");})];});
  const csv="﻿"+[head,...rows].map(r=>r.map(cell).join(",")).join("\r\n");
  try{ await downloads.save({filename:"briefs-"+new Date().toISOString().slice(0,10)+".csv", data:csv}); }
  catch(e){ if(!(e&&e.code==="declined")) toast("ماقدرتش أصدّر الملف"); }
}
async function loadList(){
  if(!me) return;
  try{ const r=await api("listBriefs",session);
    const m=new Map(); for(const b of r.briefs){ const old=briefs.get(b.id); m.set(b.id, old&&!old.partial&&old.updatedAt>=b.updatedAt?old:b); }
    briefs=m; loaded=true; if(route.v==="list"||(route.v==="view"&&!briefs.has(route.id))) render(); }
  catch(e){ if(!/SESSION|الجلسة/.test(e.message)){ loaded=true; if(route.v==="list") app.innerHTML=`<div class="note">ماقدرتش أحمّل البريفات. ${esc(e.message)}</div>`; } }
}
async function loadFull(id){
  try{ const b=await api("getBrief",session,id); briefs.set(id,b); }
  catch(e){ briefs.delete(id); loaded=true; }
  if(route.v==="view"&&route.id===id) render();
}
function assignHTML(b){
  if(!b) return "";
  const cur=(b.assigned||[]);
  if(!canEditB(b)) return cur.length?`<div class="assign"><span class="muted" style="font-size:13px">الفريق المتعيّن:</span><div class="tags">${cur.map(x=>`<span class="tag">${esc(x.name)}</span>`).join("")}</div></div>`:"";
  if(!teamUsers) return `<div class="assign"><span class="muted" style="font-size:13px">الفريق المتعيّن: بيحمّل...</span></div>`;
  const on=new Set(cur.map(x=>x.u));
  return `<div class="assign"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b style="font-size:14px">الفريق المتعيّن على البريف</b><span class="muted" style="font-size:12.5px">هما بس اللي هيشوفوه، قراية بس</span></div>
    <div class="seg" id="asg">${teamUsers.map(t=>`<button type="button" data-asg="${esc(t.u)}" aria-pressed="${on.has(t.u)}">${esc(t.name)}<span style="opacity:.7;font-size:12px"> · ${esc(t.job||"")}</span></button>`).join("")}</div>
    <div><button class="btn" id="asgsave" hidden>حفظ الفريق</button></div></div>`;
}
function bindAssign(b){
  if(!canEditB(b)) return;
  if(!teamUsers){ window.erpCall("briefTeam",{}).then(r=>{ teamUsers=r; if(route.v==="view"&&route.id===b.id) renderView(); }).catch(e=>toast(e.message)); return; }
  const box=$("#asg"), sv=$("#asgsave"); if(!box) return;
  box.querySelectorAll("[data-asg]").forEach(x=>x.onclick=()=>{ x.setAttribute("aria-pressed", x.getAttribute("aria-pressed")!=="true"); sv.hidden=false; });
  sv.onclick=async()=>{ sv.disabled=true; sv.textContent="بيحفظ...";
    const list=[...box.querySelectorAll('[data-asg][aria-pressed="true"]')].map(x=>x.dataset.asg);
    try{ const r=await window.erpCall("briefAssign",{id:b.id,assigned:list}); b.assigned=r; toast("اتحفظ الفريق ✓"); renderView(); }
    catch(e){ toast(e.message); sv.disabled=false; sv.textContent="حفظ الفريق"; } };
}
window.BriefModule={
  enter(el,user,opts){
    app=el; me=user.username; myName=user.name; myRole=user.role; isAdmin=user.role==="admin";
    canWrite=isAdmin||myRole==="am"; seeAccess=!!user.seeAccess;
    const id=opts&&opts.id;
    if(id){ route={v:"view",id}; setHash(id); render(); if(!briefs.has(id)||briefs.get(id).partial) loadFull(id); loadList(); }
    else { route={v:"list"}; setHash(""); render(); loadList(); }
    window.scrollTo(0,0);
  },
  leave(){ if(route.v==="edit"&&draft){ flush(false,draft); draft=null; } route={v:"list"}; setHash(""); }
};

})();

<script>
/* ============ الإعداد ============ */
// حط هنا لينك الـ Web App اللي بينتهي بـ /exec (مطلوب لو الصفحة مرفوعة بره جوجل)
const API_URL = 'https://script.google.com/macros/s/AKfycbwIhxu4UgOVOfSdmEjk1wOYP0MRGFFMCuWq4T6rGy9xi194yiovKC9rqNTpgvcymLCp/exec';

// اللينك الأساسي للسيستم (بيستخدم في لينكات البريفات)
const SITE_URL = 'https://ops681.github.io/miqnas/';

const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const S = { token:null, user:null, cfg:{shotMinutes:10}, view:null, status:null,
            stream:null, mode:null, lastShot:0, timer:null, tick:null, pending:[], sharing:false };
const MODE_NAMES = { tab:'تاب', window:'ويندو', screen:'الشاشة كلها' };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function store(k,v){ try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }

/* ============ الاتصال بالسيرفر ============ */
function call(action, params){
  params = Object.assign({}, params||{}, {token:S.token});
  const done = r => {
    if(r && r.ok) return r.data;
    if(r && r.error==='AUTH'){ forceLogin(); throw new Error('انتهت الجلسة، سجّل دخول تاني'); }
    throw new Error((r&&r.error)||'حصل خطأ');
  };
  if(IN_GAS){
    return new Promise((res,rej)=>{
      google.script.run.withSuccessHandler(r=>{ try{res(done(r));}catch(e){rej(e);} })
        .withFailureHandler(e=>rej(new Error(e.message||'مشكلة في الاتصال'))).api(action, params);
    });
  }
  if(API_URL.indexOf('http')!==0) return Promise.reject(new Error('لينك السيرفر مش متظبط في الصفحة'));
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},params))})
    .then(r=>r.json()).then(done)
    .catch(e=>{ throw e.message? e : new Error('مشكلة في الاتصال'); });
}

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),msg.length>40?6000:3200); }
window.erpCall = call;
window.erpToast = toast;
window.ERP_SITE_URL = SITE_URL;

/* ============ اللوجين ============ */
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('lerr').textContent=''; $('lbtn').disabled=true;
  try{
    const r = await call('login',{username:$('lu').value,password:$('lp').value});
    S.token=r.token; store('erp_token',r.token);
    await boot();
  }catch(err){ $('lerr').textContent=err.message; }
  $('lbtn').disabled=false;
});

function forceLogin(){
  if(S.sharing) return; // متوقفش الشاشة لو بيبصم، هيدخل تاني من الرسالة
  S.token=null; store('erp_token',null);
  $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); $('boot').classList.add('hidden');
}

async function logout(){
  if(S.status && S.status.clockedIn && !confirm('انت لسه عامل بصمة دخول. لو خرجت السكرين شوتس هتقف. متأكد؟')) return;
  try{ await call('logout'); }catch(e){}
  stopStream(false);
  S.token=null; store('erp_token',null); location.reload();
}

async function boot(){
  $('boot').classList.remove('hidden');
  try{
    const r = await call('me');
    S.user=r.user; S.cfg=r.cfg; S.status=r.status;
    $('loginView').classList.add('hidden'); $('boot').classList.add('hidden'); $('appView').classList.remove('hidden');
    $('uName').textContent=S.user.name; $('uRole').textContent=S.user.roleName+(S.user.job?' · '+S.user.job:'');
    buildNav();
  }catch(e){
    $('boot').classList.add('hidden'); $('loginView').classList.remove('hidden');
  }
}

/* ============ التنقل ============ */
function tabsFor(role){
  const t=[];
  if(S.user.clocks) t.push(['clock','البصمة']);
  if(role==='admin'||role==='hr') t.push(['board','النهارده'],['monthly','التقرير الشهري'],['shots','السكرين شوتس'],['users','الموظفين']);
  if(role==='team') t.push(['mytasks','My Tasks']);

function surfaceToMode(track){
  const s=(track.getSettings&&track.getSettings().displaySurface)||'';
  return s==='browser'?'tab': s==='window'?'window': s==='monitor'?'screen':'screen';
}

async function startShare(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)
    throw new Error('المتصفح ده مش بيدعم مشاركة الشاشة. افتح الصفحة من كروم أو إيدج على الكمبيوتر');
  let stream;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video:{frameRate:1}, audio:false,
      selfBrowserSurface:'include', surfaceSwitching:'include', monitorTypeSurfaces:'include'
    });
  }catch(e){
    if(IN_GAS) throw new Error('صفحة جوجل مش بتسمح بمشاركة الشاشة. افتح لينك البصمة الأساسي (اللي على GitHub) وابصم منه');
    if(e && e.name==='NotAllowedError') throw new Error('لازم توافق على مشاركة الشاشة عشان تقدر تبصم');
    throw new Error('مشاركة الشاشة مشتغلتش: '+(e.message||e.name));
  }
  const track=stream.getVideoTracks()[0];
  S.stream=stream; S.mode=surfaceToMode(track); S.sharing=true;
  const v=$('cap'); v.srcObject=stream; try{ await v.play(); }catch(e){}
  track.onended=onShareEnded;
  return S.mode;
}

function stopStream(log){
  S.sharing=false;
  clearInterval(S.tick);
  if(S.stream){ S.stream.getTracks().forEach(t=>{ t.onended=null; t.stop(); }); }
  S.stream=null;
  $('cap').srcObject=null;
}

async function onShareEnded(){
  stopStream();
  try{ await call('shareEvent',{event:'stopped'}); }catch(e){}
  showAlarm(false);
}

function showAlarm(afterReload){
  if(!S.status||!S.status.clockedIn) return;
  if(afterReload && !S.reloadLogged){ S.reloadLogged=true; call('shareEvent',{event:'stopped'}).catch(()=>{}); }
  closeModal();
  document.title='⚠ المشاركة واقفة';
  $('modalRoot').innerHTML=`<div class="alarm"><div class="card">
    <h2>مشاركة الشاشة واقفة</h2>
    <p>${afterReload?'الصفحة اتقفلت أو اتعملها ريفريش، فالمشاركة وقفت.':'المشاركة وقفت.'} انت لسه عامل بصمة دخول، ولازم ترجّع المشاركة عشان الشغل يتحسب.</p>
    <p class="muted" style="font-size:13px">ده متسجل عند الإدارة.</p>
    <div class="err" id="aerr"></div>
    <div class="mfoot" style="justify-content:center">
      <button class="btn" id="resumeBtn">رجّع المشاركة</button>
      <button class="btn ghost" id="alarmOut">بصمة خروج</button>
    </div></div></div>`;
  $('resumeBtn').onclick=async()=>{
    $('aerr').textContent='';
    try{
      const mode=await startShare();
      await call('shareEvent',{event:'resumed',mode});
      $('modalRoot').innerHTML=''; document.title='Miqnas ERP';
      startShotLoop(true);
      if(S.view==='clock') viewClock();
    }catch(e){ $('aerr').textContent=e.message; }
  };
  $('alarmOut').onclick=()=>{ $('modalRoot').innerHTML=''; document.title='Miqnas ERP'; clockOut(); };
}

async function clockIn(){
  const b=$('inBtn'); b.disabled=true; b.textContent='اختار هتشارك إيه...';
  try{
    const mode=await startShare();
    b.textContent='جاري التسجيل...';
    S.status=await call('clockIn',{mode});
    toast('اتسجلت بصمة الدخول ✓');
    startShotLoop(true);
    viewClock();
  }catch(e){
    stopStream();
    alert(e.message);
    b.disabled=false; b.textContent='بصمة دخول';
  }
}

async function clockOut(){
  if(!confirm('متأكد إنك عاوز تبصم خروج؟')) return;
  const b=$('outBtn'); if(b){ b.disabled=true; b.textContent='جاري التسجيل...'; }
  try{
    if(S.sharing) await takeShot().catch(()=>{});
    stopStream();
    S.status=await call('clockOut');
    toast('اتسجلت بصمة الخروج ✓');
    document.title='Miqnas ERP';
    viewClock();
  }catch(e){ alert(e.message); if(b){ b.disabled=false; b.textContent='بصمة خروج'; } }
}

function startShotLoop(now){
  clearInterval(S.tick);
  const ms=S.cfg.shotMinutes*60000;
  if(now) setTimeout(()=>takeShot().catch(()=>{}),2500);
  S.tick=setInterval(()=>{
    if(!S.sharing) return;
    if(S.pending.length) flushPending();
    if(Date.now()-S.lastShot>=ms) takeShot().catch(()=>{});
  },20000);
}

async function grabCanvas(maxW){
  const track=S.stream&&S.stream.getVideoTracks()[0];
  if(!track||track.readyState!=='live') throw new Error('no stream');
  let src=null,w=0,h=0;
  if('ImageCapture' in window){
    try{ const bmp=await new ImageCapture(track).grabFrame(); src=bmp; w=bmp.width; h=bmp.height; }catch(e){}
  }
  if(!src){ const v=$('cap'); src=v; w=v.videoWidth; h=v.videoHeight; }
  if(!w||!h) throw new Error('no frame');
  const out=(mw,q)=>{ const sc=Math.min(1,mw/w); const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); };
  return { image: out(maxW,0.6), thumb: out(360,0.5) };
}

async function takeShot(){
  if(!S.sharing) return;
  const shot=await grabCanvas(1600);
  shot.mode=S.mode;
  S.lastShot=Date.now();
  try{ await call('uploadShot',shot); }
  catch(e){ if(S.pending.length<3) S.pending.push(shot); }
  const el=$('lastShotT'); if(el) el.textContent=new Date(S.lastShot).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
}
async function flushPending(){
  const p=S.pending.splice(0);
  for(const s of p){ try{ await call('uploadShot',s); }catch(e){ S.pending.push(s); break; } }
}

function fmtDay(v){ if(!v) return '—'; const d=new Date(v+'T12:00:00'); return isNaN(d)? v : d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function liveSpan(t){ return `<span class="ttime" data-live data-total="${t.totalMs}" data-since="${t.running?t.runningSince:0}">${fmtDur(t.liveMs)}</span>`; }
function startTicks(){
  clearInterval(S.viewTimer);
  S.viewTimer=setInterval(()=>{ document.querySelectorAll('[data-live]').forEach(el=>{ const base=+el.dataset.total||0, since=+el.dataset.since||0; el.textContent=fmtDur(base+(since? Date.now()-S.skew-since : 0)); }); },1000);
}

function taskRowHTML(t,pid,me,isAdmin){
  if(t.na) return `<div class="trow na"><div class="tmain"><div class="tt">${esc(t.title)}</div></div><div class="tside"><span class="pill p-na">N/A</span></div></div>`;
  const assigned=(t.assignees||[]).length>0;
  const mine=(t.assignees||[]).indexOf(me)>=0||isAdmin;
  const P=`'${esc(pid)}','${esc(t.key)}'`;
  const st=TSTAT[t.status]||TSTAT['Not Started'];
  const pill = t.status==='Done' ? `<span class="pill p-in">Done ✓</span>`
    : t.running ? `<span class="pill p-run">⏱ Running</span>`
    : t.locked ? `<span class="pill p-lock">🔒 Locked</span>`
    : `<span class="pill ${st[0]}">${st[1]}</span>`;
  let btns='';
  if(mine && assigned){
    if(t.status!=='Done'){
      if(!t.locked||isAdmin){
        btns += t.running ? `<button class="tb pause" onclick="tAct(${P},'pause')">⏸ Pause</button>` : `<button class="tb play" onclick="tAct(${P},'start')">▶ Start</button>`;
        btns += `<button class="tb ok" onclick="tDone(${P})">✓ Done</button>`;
      }
    } else btns += `<button class="tb ghost" onclick="tAct(${P},'reopen')">Reopen</button>`;
  }
  if(isAdmin) btns += `<select class="tforce" onchange="if(this.value)tAct(${P},'force',{status:this.value})"><option value="">Set status…</option><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Done">Done</option></select>`;
  const wl=t.waiting.slice(0,3).map(w=>esc(w.title)+(w.name?' ('+esc(w.name)+')':'')).join(', ')+(t.waiting.length>3?` +${t.waiting.length-3} more`:'');
  const wait = t.locked ? `<div class="twait">Waiting for: ${wl}</div>` : '';
  const who = (t.assignees||[]).length>1 ? `<div class="twait">${esc(t.assigneeName)}</div>` : '';
  let link='';
  if(t.linkLabel){
    const id='lk_'+(pid+'_'+t.key).replace(/[^a-z0-9_]/gi,'_');
    link = mine && assigned
      ? `<div class="tlink"><span>${esc(t.linkLabel)}</span><input id="${id}" value="${esc(t.link)}" placeholder="https://"><button class="tb ghost" onclick="tAct(${P},'link',{link:$('${id}').value})">Save</button></div>`
      : `<div class="tlink"><span>${esc(t.linkLabel)}</span>${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.link)}</a>`:'<span class="muted">Not yet</span>'}</div>`;
  }
  return `<div class="trow${t.locked?' locked':''}${t.running?' running':''}${t.status==='Done'?' done':''}">
    <div class="tmain"><div class="tt">${esc(t.title)}</div>${who}${wait}${link}</div>
    <div class="tside">${pill}${(t.liveMs||t.running)?liveSpan(t):''}${btns}</div></div>`;
}

function tDone(pid,key){ if(confirm('Mark this task as Done?')) tAct(pid,key,'done'); }

}
